<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla de Ensayo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #333;
            line-height: 1.6;
            background-color: #f4f4f4;
            text-align: justify;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header img {
            width: 300px;
            display: block;
            margin: 0 auto 20px auto;
        }
        h1, h2 {
            color: #003366;
            text-align: center;
        }
        h2 {
            margin-top: 40px;
            border-bottom: 2px solid #003366;
            padding-bottom: 10px;
        }
        p {
            margin: 0 0 10px 0;
        }
        .section {
            margin-bottom: 20px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .section-title {
            font-weight: bold;
            color: #003366;
        }
        .content {
            padding-left: 15px;
        }
        .references {
            list-style-type: none;
            padding-left: 0;
        }
        .references li {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="https://i.imgur.com/LaWWKiY.png" alt="PUCE Logo">
            <h1>{{title}}</h1>
        </header>
        
        <div class="section">
            <p><span class="section-title">Autor:</span> {{author}}</p>
            <p><span class="section-title">Curso:</span> {{course}}</p>
            <p><span class="section-title">Instructor:</span> {{instructor}}</p>
            <p><span class="section-title">Fecha de Entrega:</span> {{dueDate}}</p>
        </div>

        <div class="section">
            <h2>Resumen</h2>
            <div class="content">
                <p>{{abstract}}</p>
            </div>
        </div>

        <div class="section">
            <h2>Introducción</h2>
            <div class="content">
                <p>{{introduction}}</p>
            </div>
        </div>

        <div class="section">
            <h2>Desarrollo</h2>
            <div class="content">
                <p>{{body}}</p>
            </div>
        </div>

        <div class="section">
            <h2>Conclusión</h2>
            <div class="content">
                <p>{{conclusion}}</p>
            </div>
        </div>

        <div class="section">
            <h2>Referencias</h2>
            <div class="content">
                <ul class="references">
                    <li>{{references}}</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
